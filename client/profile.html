<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | Auth Dashboard</title>
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

    <header class="dashboard-header">
        <div class="logo">Auth Dashboard</div>

        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="profile.html">Profile</a>
            <button id="logoutBtn">Logout</button>
        </nav>
    </header>

    <main class="dashboard-container">

        <section class="welcome-section">
            <h1>My Profile</h1>
            <p>View your account information</p>
        </section>

        
<section class="profile-card">

    <div class="profile-avatar" id="profileAvatar">U</div>

    <h2 id="profileName">Loading...</h2>
    <p id="profileEmail">Loading...</p>

    <div class="profile-details">
        <p><strong>Full Name:</strong> <span id="detailName">Loading...</span></p>
        <p><strong>Email:</strong> <span id="detailEmail">Loading...</span></p>
        <p><strong>Account Created:</strong> <span id="createdAt">Loading...</span></p>
    </div>

    <button id="editProfileBtn">Edit Profile</button>

    <form id="editProfileForm" style="display: none; text-align: left; max-width: 500px; margin: 25px auto;">

        <div class="form-group">
            <label for="editName">Full Name</label>
            <input type="text" id="editName" required>
        </div>
        <br>

        <div class="form-group">
            <label for="editEmail">Email Address</label>
            <input type="email" id="editEmail" required>
        </div>

        <button type="submit" id="saveProfileBtn">Save Changes</button>

        <button type="button" id="cancelEditBtn" style="background: #777; margin-top: 10px;">
            Cancel
        </button>

    </form>

    <p id="message"></p>

    <a href="dashboard.html" class="back-link">Back to Dashboard</a>

</section>


    </main>

    <script src="js/profile.js"></script>

</body>
</html>
